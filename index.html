function resizeImageToBase64(file, maxDim = 1024) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la imagen"));
    reader.onload = () => {
      const img = new window.Image();
      img.onerror = () => reject(new Error("No se pudo procesar la imagen"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * maxDim / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round(width * maxDim / height);
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
        resolve({ base64: dataUrl.split(",")[1], mediaType: "image/jpeg" });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function extractJsonObject(text) {

const CSS = `
:root {
  --bg: #15171a;
  --surface: #1e2126;
  --surface-alt: #262a31;
  --border: #2c3036;
  --text: #f2f0ea;
  --text-dim: #9aa0a6;
  --amber: #e3b341;
  --good: #6fcf97;
  --warn: #e3b341;
  --bad: #eb6a5a;
}
* { box-sizing: border-box; }
.app-root {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 560px;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.loading-root {
  align-items: center;
  justify-content: center;
  flex-direction: row;
  gap: 10px;
  padding: 40px;
  color: var(--text-dim);
  font-size: 13px;
}
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #1a1d21, var(--bg));
}
.eyebrow {
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--amber);
  font-weight: 600;
  margin-bottom: 2px;
}
.topbar h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.ghost-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 7px 12px;
  border-radius: 8px;
  font-size: 12.5px;
  cursor: pointer;
}
.content {
  padding: 14px 14px 90px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.date-row { display: flex; align-items: center; gap: 8px; }
.date-input {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.pill {
  font-size: 10.5px;
  color: var(--amber);
  background: rgba(227,179,65,0.1);
  border: 1px solid rgba(227,179,65,0.3);
  padding: 3px 8px;
  border-radius: 999px;
}
.field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.field-row { display: flex; gap: 10px; }
.field-label {
  font-size: 11.5px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
input {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 11px;
  border-radius: 9px;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  width: 100%;
}
input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
.chip-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 10px 12px;
  border-radius: 9px;
  font-size: 13px;
  cursor: pointer;
}
.chip-toggle.on {
  background: rgba(111,207,151,0.12);
  border-color: rgba(111,207,151,0.4);
  color: var(--good);
}
.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  cursor: pointer;
}
.chip.on {
  background: var(--amber);
  border-color: var(--amber);
  color: #1a1a1a;
  font-weight: 700;
}
.save-btn {
  background: var(--amber);
  color: #1a1a1a;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.save-btn.small { padding: 9px; font-size: 13px; border-radius: 8px; }
.save-btn:disabled { opacity: 0.5; }
.photo-actions { display: flex; gap: 8px; }
.photo-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--amber);
  color: #1a1a1a;
  border: none;
  padding: 10px 6px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.photo-btn.ghost {
  background: var(--surface-alt);
  color: var(--text);
  border: 1px solid var(--border);
}
.photo-btn:disabled { opacity: 0.5; }
.analyzing-row, .error-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  color: var(--text-dim);
}
.error-row { color: var(--bad); }
.manual-meal {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px;
}
.meal-list { display: flex; flex-direction: column; gap: 8px; }
.meal-card {
  display: flex;
  flex-direction: column;
  gap: 7px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px;
}
.meal-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.meal-name {
  background: transparent;
  border: none;
  padding: 2px;
  font-size: 13px;
  font-weight: 700;
  flex: 1;
  min-width: 0;
}
.meal-badge {
  font-size: 11px;
  color: var(--amber);
  white-space: nowrap;
}
.item-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-top: 1px dashed var(--border);
  padding-top: 6px;
}
.item-row-top { display: flex; align-items: center; gap: 6px; }
.item-name {
  background: transparent;
  border: none;
  font-size: 12.5px;
  flex: 1;
  min-width: 0;
  padding: 2px;
}
.item-row-bottom { display: flex; gap: 6px; }
.item-qty {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 11px;
  padding: 5px 6px;

}
.item-num {
  background: var(--surface);

}
.add-item-btn {

  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 11.5px;
  padding: 2px;

}
.meal-unit { font-size: 10.5px; color: var(--text-dim); }
.meal-total {
  display: flex;
  justify-content: space-between;

  border-top: 1px solid var(--border);

}
.meal-total strong { color: var(--amber); font-size: 13.5px; }
.exercise-group { display: flex; flex-direction: column; gap: 8px; }
.exercise-group-title {

.exercise-card {

}
.exercise-card-head { display: flex; align-items: center; gap: 8px; }
.exercise-name {
  background: transparent;
  border: none;
  font-size: 13px;
  font-weight: 700;
  flex: 1;
  min-width: 0;
  padding: 2px;
}
.set-row {

  align-items: center;
  gap: 7px;
}
.set-index { font-size: 10.5px; color: var(--text-dim); width: 18px; }
.set-num {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12.5px;

  text-align: center;
}
.set-x { color: var(--text-dim); font-size: 12px; }
.detail-toggle {

}
.balance-card { gap: 10px; }
.balance-breakdown { display: flex; flex-direction: column; gap: 5px; }

.balance-line.total {

.balance-result {

.balance-badge.deficit { color: var(--good); }
